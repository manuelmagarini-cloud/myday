const $=s=>document.querySelector(s), cats={'Lavoro':'#3688ef','Salute e sport':'#19b981','Apprendimento':'#ff7959','Svago':'#a855f7','Socialità':'#e74d82','Tempo libero':'#20b9d5','Riposo':'#8592a8','Economia':'#ffbc25'};let items=[],mode='day',selected,deadline=0,timerName='';const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`, dateObj=s=>new Date(s+'T12:00:00'), shift=(s,n)=>{let d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)}, mins=s=>+s.slice(0,2)*60 + +s.slice(3), time=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;$('#date').value=iso(new Date());document.querySelectorAll('select').forEach(s=>Object.keys(cats).forEach(c=>s.add(new Option(c,c))));for(let [c,v] of Object.entries(cats)){let e=document.createElement('span');e.innerHTML=`<i class="dot" style="background:${v}"></i>`;e.append(c);$('#legend').append(e)}function save(){render();pushCloud()}function onDay(d){return items.filter(a=>a.date===d||(a.repeat&&d>=a.date&&dateObj(d).getDay()===dateObj(a.date).getDay()))}function valid(a,ignore){if(mins(a.end)<=mins(a.start)){alert('La fine deve seguire l’inizio.');return false}if(onDay(a.date).some(b=>b.id!==ignore&&mins(a.start)<mins(b.end)&&mins(a.end)>mins(b.start))){alert('Le attività si sovrappongono.');return false}return true}function data(f){let x=Object.fromEntries(new FormData(f));x.repeat=!!x.repeat;return x}$('#add').onsubmit=e=>{e.preventDefault();let a={...data(e.target),date:$('#date').value,id:crypto.randomUUID(),done:false};if(valid(a)){items.push(a);save();e.target.elements.name.value='';if(matchMedia('(max-width:700px)').matches)closeMobileAdd()}};function open(a){selected=a.id;let f=$('#editForm');for(let k of ['name','cat','date','start','end'])f.elements[k].value=a[k];f.elements.repeat.checked=a.repeat;$('#complete').textContent=a.done?'Riapri':'Completa';$('#edit').showModal()}$('#editForm').onsubmit=e=>{e.preventDefault();let a=items.find(x=>x.id===selected),b={...a,...data(e.target)};if(valid(b,selected)){Object.assign(a,b);$('#edit').close();save()}};$('#close').onclick=()=>$('#edit').close();$('#remove').onclick=()=>{if(confirm('Eliminare questa attività (anche le ricorrenze)?')){items=items.filter(a=>a.id!==selected);$('#edit').close();save()}};$('#complete').onclick=()=>{let a=items.find(x=>x.id===selected);a.done=!a.done;$('#edit').close();save()};$('#launch').onclick=()=>{let a=items.find(x=>x.id===selected);deadline=Date.now()+(mins(a.end)-mins(a.start))*60000;timerName=a.name;$('#edit').close();tick()};function tick(){if(!deadline)return;let s=Math.max(0,Math.ceil((deadline-Date.now())/1000));$('#timer').textContent=timerName+' · '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0');$('#stop').hidden=false;if(!s){deadline=0;$('#timer').textContent=timerName+' · Tempo terminato';}}setInterval(tick,500);$('#stop').onclick=()=>{deadline=0;$('#timer').textContent='';$('#stop').hidden=true};function render(){let v=$('#view'),d=$('#date').value;v.replaceChildren();if(mode==='ring'){let sums={},used=0;for(let a of onDay(d)){let n=mins(a.end)-mins(a.start);sums[a.cat]=(sums[a.cat]||0)+n;used+=n}let p=0,parts=[];for(let [c,n] of Object.entries(sums)){let q=Math.min(100,p+n/14.4);parts.push(`${cats[c]} ${p}% ${q}%`);p=q}if(p<100)parts.push(`#e6eaf1 ${p}% 100%`);let r=document.createElement('div');r.className='ring';r.style.background=`conic-gradient(${parts.join(',')})`;r.innerHTML='<div class="hole">24h<small style="font-size:13px">Il mio tempo</small></div>';v.append(r);for(let [c,n] of [...Object.entries(sums),['Non programmato',Math.max(0,1440-used)]]){let l=document.createElement('p');l.textContent=`${c}: ${Math.floor(n/60)}h ${n%60}m`;v.append(l)}return}if(mode==='day'){let head=document.createElement('div');head.className='daily-title';head.innerHTML='<h2>La mia giornata</h2><span class="sun">☼</span>';v.append(head);let sub=document.createElement('p');sub.className='daily-date';sub.textContent=dateObj(d).toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'});sub.style.textTransform='capitalize';v.append(sub);let list=onDay(d).sort((a,b)=>mins(a.start)-mins(b.start));const paths={'Lavoro':'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V4h8v3M3 13h18"/>','Salute e sport':'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>','Apprendimento':'<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>','Svago':'<path d="M4 8h13v7a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM17 9h2a3 3 0 0 1 0 6h-2M8 2v3M12 2v3"/>','Socialità':'<circle cx="9" cy="7" r="3"/><path d="M2 20v-3a7 7 0 0 1 14 0v3M17 4a3 3 0 0 1 0 6M18 13a5 5 0 0 1 4 5v2"/>','Tempo libero':'<path d="M4 3v7a3 3 0 0 0 6 0V3M7 3v18M18 3c-3 3-3 8 0 9h2V3zM20 12v9"/>','Riposo':'<path d="M20 15A9 9 0 0 1 9 4a9 9 0 1 0 11 11z"/>','Economia':'<path d="M12 3l9 5v9l-9 5-9-5V8zM3 8l9 5 9-5M12 13v9"/>'};for(let a of list){let row=document.createElement('div');row.className='daily-row';let t=document.createElement('span');t.className='daily-time';t.textContent=a.start;let b=document.createElement('button');b.className='daily-event'+(a.done?' done':'');b.style.background=cats[a.cat];b.style.minHeight=(58+(mins(a.end)-mins(a.start))*.32)+'px';b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(paths[a.cat]||paths.Svago)+'</svg>';let text=document.createElement('span'),name=document.createElement('strong'),hours=document.createElement('small');name.textContent=a.name;hours.textContent=a.start+' – '+a.end;text.append(name,hours);b.append(text);b.onclick=()=>open(a);row.append(t,b);v.append(row)}if(!list.length){let empty=document.createElement('div');empty.className='daily-empty';empty.textContent='Nessuna attività programmata. Aggiungine una per iniziare.';v.append(empty)}return}let days=mode==='day'?[d]:Array.from({length:7},(_,i)=>shift(d,i-((dateObj(d).getDay()+6)%7)));let g=document.createElement('div');g.className='calendar';g.style.gridTemplateColumns=`48px repeat(${days.length},minmax(${mode==='week'?110:220}px,1fr))`;g.append(document.createElement('div'));for(let day of days){let h=document.createElement('div');h.className='heading';h.textContent=dateObj(day).toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});g.append(h)}let axis=document.createElement('div');axis.className='axis';for(let i=0;i<24;i++){let t=document.createElement('span');t.className='hour';t.style.top=i*48+'px';t.textContent=time(i*60);axis.append(t)}g.append(axis);for(let day of days){let col=document.createElement('div');col.className='day';col.ondragover=e=>e.preventDefault();col.ondrop=e=>{e.preventDefault();let a=items.find(x=>x.id===e.dataTransfer.getData('text/plain'));if(!a)return;let duration=mins(a.end)-mins(a.start),n=Math.max(0,Math.min(1439-duration,Math.round((e.clientY-col.getBoundingClientRect().top)/48*4)*15));let b={...a,date:day,start:time(n),end:time(n+duration)};if(valid(b,a.id)){Object.assign(a,b);save()}};for(let a of onDay(day)){let b=document.createElement('button');b.className='event'+(a.done?' done':'');b.style.cssText=`top:${mins(a.start)*.8}px;height:${(mins(a.end)-mins(a.start))*.8}px;background:${cats[a.cat]||'#8592a8'}`;b.title=a.name+' '+a.start+'–'+a.end;b.textContent=a.name;let s=document.createElement('small');s.textContent=a.start+'–'+a.end;b.append(s);b.onclick=()=>open(a);b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData('text/plain',a.id);col.append(b)}g.append(col)}v.append(g)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));render()});$('#date').onchange=render;$('#prev').onclick=()=>{$('#date').value=shift($('#date').value,mode==='week'?-7:-1);render()};$('#next').onclick=()=>{$('#date').value=shift($('#date').value,mode==='week'?7:1);render()};$('#today').onclick=()=>{$('#date').value=iso(new Date());render()};$('#export').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(items,null,2)],{type:'application/json'}));a.download='myday-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let a=JSON.parse(await e.target.files[0].text());if(!Array.isArray(a)||!a.every(x=>typeof x.name==='string'&&typeof x.id==='string'&&cats[x.cat]&&/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&/^\d{2}:\d{2}$/.test(x.start)&&/^\d{2}:\d{2}$/.test(x.end)&&mins(x.end)>mins(x.start)))throw Error();if(confirm('Sostituire le attività attuali con il backup?')){items=a;save()}}catch{alert('Backup non valido.')}e.target.value=''};render();
function applyWallpaper(value){if(value)document.body.style.setProperty('--wallpaper',`url("${value}")`);else document.body.style.removeProperty('--wallpaper')}
try{applyWallpaper(localStorage.getItem('myday-wallpaper'))}catch{}
document.querySelector('#wallpaper').onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,1920/im.width,1920/im.height);c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext('2d').drawImage(im,0,0,c.width,c.height);let v=c.toDataURL('image/jpeg',.8);applyWallpaper(v);try{localStorage.setItem('myday-wallpaper',v)}catch{alert('Sfondo applicato, ma non salvato nel browser.')}};im.src=r.result};r.readAsDataURL(f)};
document.querySelector('#resetWallpaper').onclick=()=>{applyWallpaper(null);try{localStorage.removeItem('myday-wallpaper')}catch{}};

const cloud=window.supabase?.createClient('https://irhinsofsmrgxbpdkngj.supabase.co','sb_publishable_D4uAsL2fAXtfDbK1oT07FA_pZBoOnId',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'myday-auth-v1',detectSessionInUrl:false}});
let user=null,version=null,busy=false;
const gate=document.createElement('dialog');gate.style.cssText='max-width:90vw;width:380px;padding:24px;border:0;border-radius:20px';gate.innerHTML='<h2>☀ My Day</h2><p>Accedi al tuo calendario privato.</p><form id="login"><input type="email" placeholder="Email" required autocomplete="username" style="width:100%;margin-bottom:8px"><input type="password" placeholder="Password" required autocomplete="current-password" style="width:100%;margin-bottom:8px"><button>Accedi</button></form><p id="loginmsg" role="status"></p>';document.body.append(gate);gate.addEventListener('cancel',e=>e.preventDefault());
const panel=document.createElement('section');panel.id='cloudPanel';panel.style.cssText='background:white;padding:12px;border-radius:14px;margin:12px auto;max-width:1100px';panel.innerHTML='<strong id="cloudstatus">Connessione…</strong> <button id="refreshcloud">Aggiorna</button> <button id="logout">Esci</button><div id="nowday" style="margin-top:8px"></div>';document.body.prepend(panel);if(matchMedia("(max-width:700px)").matches)document.querySelector("main").append(panel);
function status(t){$('#cloudstatus').textContent=t}function lock(v){busy=v;document.querySelectorAll('body > :not(dialog)').forEach(e=>{if(e!==gate)e.inert=v});} 
async function pullCloud(){if(!user||busy)return;lock(true);try{let {data,error}=await cloud.from('myday_activities').select('activities,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;items=data?.activities||[];version=data?.updated_at||null;render();status('Sincronizzato');}catch(e){status('Connessione non riuscita: premi Aggiorna');console.warn('My Day sync',e);}finally{lock(false)}}
async function pushCloud(){if(!user||busy)return;lock(true);let snapshot=JSON.parse(JSON.stringify(items));try{let stamp=new Date().toISOString();let q=version?cloud.from('myday_activities').update({activities:snapshot,updated_at:stamp}).eq('user_id',user.id).eq('updated_at',version):cloud.from('myday_activities').insert({user_id:user.id,activities:snapshot,updated_at:stamp});let {data,error}=await q.select('updated_at');if(error||!data?.length)throw error||Error('Conflitto');version=data[0].updated_at;status('Sincronizzato');}catch(e){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(snapshot)],{type:'application/json'}));a.download='myday-modifiche-non-salvate.json';a.textContent='Scarica modifiche non salvate';panel.append(a);alert('Salvataggio non riuscito o modifiche da un altro dispositivo. Scarica il backup delle modifiche prima di aggiornare.');status('Non salvato');}finally{lock(false)}}
$('#login').onsubmit=async e=>{e.preventDefault();let f=e.target;$('#loginmsg').textContent='Accesso…';try{if(!cloud)throw Error();let {data,error}=await cloud.auth.signInWithPassword({email:f.elements[0].value,password:f.elements[1].value});if(error)throw error;user=data.user;f.reset();gate.close();await pullCloud()}catch{ $('#loginmsg').textContent='Accesso non riuscito. Controlla credenziali e connessione.'}};
$('#refreshcloud').onclick=pullCloud;$('#logout').onclick=async()=>{await cloud.auth.signOut();user=null;items=[];version=null;render();gate.showModal();status('Non connesso')};
function nowView(){let d=new Date(),m=d.getHours()*60+d.getMinutes(),list=onDay(iso(d)).sort((a,b)=>mins(a.start)-mins(b.start)),a=list.find(x=>mins(x.start)<=m&&mins(x.end)>m),n=list.find(x=>mins(x.start)>m);$('#nowday').textContent=(a?'In corso: '+a.name+' · '+(mins(a.end)-m)+' min rimanenti':'Nessuna attività in corso')+(n?' | Prossima: '+n.start+' '+n.name:'');}setInterval(nowView,1000);nowView();
function closeMobileAdd(){ $('#addPanel').classList.remove('expanded');$('#mobileAdd').textContent='+ Nuova attività';$('#mobileAdd').setAttribute('aria-expanded','false'); }
$('#mobileAdd').onclick=()=>{let expanded=$('#addPanel').classList.toggle('expanded');$('#mobileAdd').textContent=expanded?'− Chiudi inserimento':'+ Nuova attività';$('#mobileAdd').setAttribute('aria-expanded',String(expanded));if(expanded)$('#add input[name=name]').focus()};
$('#mobileToday').onclick=()=>{$('#date').value=iso(new Date());document.querySelector('[data-mode=day]').click();window.scrollTo({top:0,behavior:'smooth'})};
function mobileSummary(){let d=new Date(),m=d.getHours()*60+d.getMinutes(),list=onDay(iso(d)).filter(x=>!x.done).sort((a,b)=>mins(a.start)-mins(b.start)),a=list.find(x=>mins(x.start)<=m&&mins(x.end)>m),n=list.find(x=>mins(x.start)>m);$('#mobileClock').textContent='ADESSO · '+time(m);$('#mobileCurrent').textContent=a?a.name:'Nessuna attività in corso';$('#mobileRemaining').textContent=a?(mins(a.end)-m)+' min rimanenti':n?'Prossima attività tra '+(mins(n.start)-m)+' min':'Nessun altro impegno programmato';$('#mobileNext').textContent=n?'PROSSIMA · '+n.start+' · '+n.name:'';$('#mobileNext').hidden=!n;}
setInterval(mobileSummary,1000);mobileSummary();
(async()=>{items=[];render();lock(true);if(!cloud){gate.showModal();lock(false);$('#loginmsg').textContent='Connessione alla libreria non disponibile.';return}try{let {data,error}=await cloud.auth.getSession();if(error)throw error;lock(false);if(data.session){user=data.session.user;await pullCloud()}else{gate.showModal();status('Non connesso')}}catch(e){lock(false);gate.showModal();$('#loginmsg').textContent='Sessione non recuperata. Riprova oppure accedi.'}})();
setInterval(()=>{if(user&&!busy&&!document.hidden&&!document.querySelector('dialog[open]')&&['Sincronizzato','Connessione non riuscita: premi Aggiorna'].includes($('#cloudstatus').textContent)&&!document.activeElement.matches('input,select,textarea'))pullCloud()},20000);
